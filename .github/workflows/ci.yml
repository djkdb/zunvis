name: CI

on:
  push:
    branches: ["**"]
  pull_request:

jobs:
  test:
    runs-on: macos-latest  # JUNVIS는 macOS를 최우선으로 설계한다
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: 의존성 설치
        run: uv pip install --system -e ".[dev]"

      - name: 계층 규칙 검사
        # 설계 문서의 의존성 규칙을 문서가 아니라 계약으로 강제한다.
        run: lint-imports

      - name: 테스트
        run: pytest
