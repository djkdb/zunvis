[project]
name = "junvis"
version = "0.1.0"
description = "JUNVIS — personal AI OS for macOS"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
dependencies = [
    "mcp>=1.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "import-linter>=2.0",
]

[project.scripts]
junvis = "junvis.apps.cli.main:main"
junvis-mcp = "junvis.apps.mcp_server.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/junvis"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

# ---------------------------------------------------------------------------
# 계층 규칙 강제 (docs/02-ARCHITECTURE.md §1 "의존성 규칙")
# 문서로만 두지 않고 CI에서 실패시킨다.
# ---------------------------------------------------------------------------
[tool.importlinter]
root_package = "junvis"
# 도메인이 sqlite3·mcp 같은 외부 모듈을 임포트하지 않는지 보려면 필요하다.
include_external_packages = true

[[tool.importlinter.contracts]]
name = "1. apps -> features -> core 방향으로만 의존한다"
type = "layers"
layers = ["junvis.apps", "junvis.features", "junvis.core"]

[[tool.importlinter.contracts]]
name = "2. feature 내부는 interface > infrastructure > application > domain"
type = "layers"
containers = [
    "junvis.features.project_brain",
    "junvis.features.creator",
    "junvis.features.brief",
]
layers = ["interface", "infrastructure", "application", "domain"]

[[tool.importlinter.contracts]]
name = "3. domain은 순수하다 (외부 기술을 모른다)"
type = "forbidden"
source_modules = [
    "junvis.features.project_brain.domain",
    "junvis.features.creator.domain",
    "junvis.features.brief.domain",
    "junvis.core.domain",
]
forbidden_modules = [
    "sqlite3",
    "subprocess",
    "urllib",
    "mcp",
    "junvis.core.persistence",
]

[[tool.importlinter.contracts]]
name = "4. application은 인프라 기술을 모른다"
type = "forbidden"
source_modules = [
    "junvis.features.project_brain.application",
    "junvis.features.creator.application",
    "junvis.features.brief.application",
]
forbidden_modules = ["sqlite3", "subprocess", "urllib", "mcp"]

[[tool.importlinter.contracts]]
name = "5. core는 어떤 feature도 임포트하지 않는다"
type = "forbidden"
source_modules = ["junvis.core"]
forbidden_modules = ["junvis.features", "junvis.apps"]

# feature끼리는 서로의 contracts(공개 계약)로만 만난다.
# 그 밖의 결합은 조립 루트(apps/adapters.py)를 거쳐야 한다.
[[tool.importlinter.contracts]]
name = "6. creator는 project_brain의 내부를 모른다"
type = "forbidden"
source_modules = ["junvis.features.creator"]
forbidden_modules = [
    "junvis.features.project_brain.domain",
    "junvis.features.project_brain.application",
    "junvis.features.project_brain.infrastructure",
    "junvis.features.project_brain.interface",
]
# contracts는 공개 계약이므로 그것을 통해 닿는 것은 허용한다.
# 금지되는 것은 내부 모듈을 **직접** 임포트하는 것이다.
allow_indirect_imports = true

[[tool.importlinter.contracts]]
name = "7. project_brain은 creator를 전혀 모른다"
type = "forbidden"
source_modules = ["junvis.features.project_brain"]
forbidden_modules = ["junvis.features.creator", "junvis.features.brief"]

# brief는 모든 것을 읽지만 아무것도 임포트하지 않는다.
# 입력 형태를 스스로 정의하고, 조립 루트가 어댑터로 채운다.
[[tool.importlinter.contracts]]
name = "8. brief는 다른 feature를 전혀 임포트하지 않는다"
type = "forbidden"
source_modules = ["junvis.features.brief"]
forbidden_modules = ["junvis.features.project_brain", "junvis.features.creator"]

[[tool.importlinter.contracts]]
name = "9. creator는 brief를 모른다"
type = "forbidden"
source_modules = ["junvis.features.creator"]
forbidden_modules = ["junvis.features.brief"]
